name: Test PostgreSQL driver adapter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Set environment variable for Postgres
        run: echo "POSTGRES_TEST_DATABASE_URL=postgresql://testuser:testpassword@localhost:5432/testdb?sslmode=disable" >> $GITHUB_ENV

      - name: Run tests
        working-directory: ./anaki_drivers_adapters/modules/postgres
        run: go test ./tests/driver/... ./tests/utils/... ./tests/ffi/...